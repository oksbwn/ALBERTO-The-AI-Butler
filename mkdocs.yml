site_name: Alberto Documentation
site_description: Technical Documentation for Alberto — Local-first AI Butler and Multi-Agent Automation Platform
site_author: Alberto Engineering Team
site_url: https://alberto.readthedocs.io/
repo_url: https://github.com/oksbwn/ALBERTO---The-AI-Butler
repo_name: ALBERTO---The-AI-Butler
copyright: Copyright &copy; 2026 Alberto Contributors. MIT Licensed.

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/alberto_icon.png
  favicon: assets/alberto_icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

not_in_nav: |
  cleanup/*
  plans/*
  reviews/*
  architecture/decisions/*
  architecture/ALBERTO_*.md
  architecture/BUTLER_*.md
  architecture/MODEL_*.md
  operations/RELEASE_PROCESS.md

