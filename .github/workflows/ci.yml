name: Alberto CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    # Skip branch push CI if the commit is an official release commit (Release pipeline runs on the tag)
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[all,dev]"

      - name: Set up Node.js 22 & Corepack (pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile || (cd frontend && npm ci || npm install)

      - name: Run Unified Quality Gate (tests/check.sh)
        run: |
          chmod +x tests/check.sh tests/lint.sh tests/run.sh
          ./tests/check.sh
