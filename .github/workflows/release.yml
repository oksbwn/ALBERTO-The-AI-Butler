name: Alberto Release & Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Quality Gate Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[all,dev]"

      - name: Set up Node.js 22 & Corepack (pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile || (cd frontend && npm ci || npm install)

      - name: Run Unified Quality Gate (tests/check.sh)
        run: |
          chmod +x tests/check.sh tests/lint.sh tests/run.sh
          ./tests/check.sh

  release:
    name: Release Gate & GHCR Publishing
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Independent Release Safeguards
      # ------------------------------------------------------------------------
      - name: Validate Release Tag Integrity & History
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Inspecting release tag: $TAG_NAME"

          # 1. Validate full semver format (vMAJOR.MINOR.PATCH)
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Tag '$TAG_NAME' does not match strict semver format vX.Y.Z" >&2
            exit 1
          fi

          # 2. Confirm tag matches canonical version.json
          if [[ ! -f "version.json" ]]; then
            echo "❌ Error: version.json not found in repository root" >&2
            exit 1
          fi

          JSON_VERSION="$(jq -r .version version.json)"
          JSON_TAG="$(jq -r .tag version.json)"

          if [[ "$TAG_NAME" != "$JSON_TAG" ]]; then
            echo "❌ Error: Tag mismatch: git tag is '$TAG_NAME' but version.json tag is '$JSON_TAG'" >&2
            exit 1
          fi

          if [[ "v$JSON_VERSION" != "$JSON_TAG" ]]; then
            echo "❌ Error: Inconsistent version.json: version '$JSON_VERSION' does not match tag '$JSON_TAG'" >&2
            exit 1
          fi

          # 3. Confirm tagged commit belongs to master branch history
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "❌ Error: Tagged commit $(git rev-parse HEAD) is NOT in master branch history" >&2
            exit 1
          fi

          # 4. Confirm the tag is an annotated tag (not a lightweight tag)
          # In Git, an annotated tag has a dereferenced commit object peeled via ^{} in ls-remote
          if ! git ls-remote origin "refs/tags/$TAG_NAME^{}" | grep -q "$TAG_NAME"; then
            echo "❌ Error: Tag '$TAG_NAME' must be an annotated git tag" >&2
            exit 1
          fi

          echo "✓ All release tag integrity safeguards passed."

      # ------------------------------------------------------------------------
      # Single Docker Image Build & Validation
      # ------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Docker Image (Local Test Target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: alberto:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Smoke Test & Lifecycle Validation
        run: |
          echo "Starting container smoke test..."
          TEST_DATA="$(mktemp -d)"
          chmod 775 "$TEST_DATA"

          # Start unified container with mounted data volume (strictly exposing port 3000)
          docker run -d \
            --name alberto-smoke \
            -p 3000:3000 \
            -v "$TEST_DATA:/data" \
            -e ALBERTO_ENVIRONMENT=test \
            -e ALBERTO_DATA_DIR=/data \
            -e ALBERTO_JWT_SECRET=test-secret-key-for-container-smoke-testing-32chars \
            alberto:test

          echo "Verifying backend port 8000 is NOT exposed publicly..."
          if curl -s --connect-timeout 2 http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
            echo "❌ Error: Backend port 8000 is unexpectedly accessible from host!" >&2
            docker logs alberto-smoke >&2
            docker rm -f alberto-smoke >/dev/null 2>&1 || true
            sudo rm -rf "$TEST_DATA"
            exit 1
          fi
          echo "✓ Backend port 8000 is strictly internal"

          echo "Polling readiness via Next.js reverse proxy (http://127.0.0.1:3000/api/alberto/readyz)..."
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/alberto/readyz >/dev/null 2>&1; then
              READY=1
              echo "✓ Backend healthcheck passed via proxy after ${i}s"
              break
            fi
            sleep 1
          done

          if [[ "$READY" -ne 1 ]]; then
            echo "❌ Error: Backend failed to become ready through proxy within 45s. Container logs:" >&2
            docker logs alberto-smoke >&2
            docker rm -f alberto-smoke >/dev/null 2>&1 || true
            sudo rm -rf "$TEST_DATA"
            exit 1
          fi

          echo "Testing frontend accessibility (http://127.0.0.1:3000)..."
          FRONTEND_OK=0
          for i in $(seq 1 30); do
            FRONTEND_HTTP="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || echo "000")"
            if [[ "$FRONTEND_HTTP" == "200" || "$FRONTEND_HTTP" == "307" || "$FRONTEND_HTTP" == "308" ]]; then
              FRONTEND_OK=1
              echo "✓ Frontend responded with HTTP $FRONTEND_HTTP after ${i}s"
              break
            fi
            sleep 1
          done

          if [[ "$FRONTEND_OK" -ne 1 ]]; then
            echo "❌ Error: Frontend failed to respond within 30s (last HTTP: $FRONTEND_HTTP). Container logs:" >&2
            docker logs alberto-smoke >&2
            docker rm -f alberto-smoke >/dev/null 2>&1 || true
            sudo rm -rf "$TEST_DATA"
            exit 1
          fi

          echo "Testing version endpoint via proxy..."
          VERSION_HTTP="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/alberto/readyz)"
          if [[ "$VERSION_HTTP" != "200" ]]; then
            echo "❌ Error: Health probe via proxy failed: $VERSION_HTTP" >&2
            docker rm -f alberto-smoke >/dev/null 2>&1 || true
            sudo rm -rf "$TEST_DATA"
            exit 1
          fi
          echo "✓ Health probe via proxy returned 200"

          echo "Testing persistent storage mount..."
          if [[ ! -d "$TEST_DATA/db" || ! -f "$TEST_DATA/db/alberto.db" ]]; then
            echo "❌ Error: Persistent /data/db/alberto.db was not initialized" >&2
            docker rm -f alberto-smoke >/dev/null 2>&1 || true
            sudo rm -rf "$TEST_DATA"
            exit 1
          fi
          echo "✓ Persistent storage /data initialized successfully"

          echo "Testing graceful container shutdown..."
          docker stop --timeout 15 alberto-smoke
          docker rm alberto-smoke
          echo "✓ Container shut down gracefully"

          echo "Testing persistence across container recreation..."
          docker run -d \
            --name alberto-smoke-persist \
            -p 3000:3000 \
            -v "$TEST_DATA:/data" \
            -e ALBERTO_ENVIRONMENT=test \
            -e ALBERTO_DATA_DIR=/data \
            -e ALBERTO_JWT_SECRET=test-secret-key-for-container-smoke-testing-32chars \
            alberto:test

          PERSIST_OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/alberto/readyz >/dev/null 2>&1; then
              PERSIST_OK=1
              echo "✓ Recreated container became ready after ${i}s with existing data"
              break
            fi
            sleep 1
          done

          if [[ "$PERSIST_OK" -ne 1 ]]; then
            echo "❌ Error: Recreated container failed to become ready. Container logs:" >&2
            docker logs alberto-smoke-persist >&2
            docker rm -f alberto-smoke-persist >/dev/null 2>&1 || true
            sudo rm -rf "$TEST_DATA"
            exit 1
          fi

          docker stop --timeout 15 alberto-smoke-persist
          docker rm alberto-smoke-persist
          sudo rm -rf "$TEST_DATA"
          echo "✓ Container smoke and persistence tests passed completely."

      # ------------------------------------------------------------------------
      # GHCR Single-Image Publication
      # ------------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alberto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Publish Unified Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
